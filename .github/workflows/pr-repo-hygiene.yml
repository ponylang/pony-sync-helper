name: Repository Hygiene

on: pull_request

concurrency:
  group: pr-repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: read

jobs:
  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Lint markdown
        uses: docker://ghcr.io/ponylang/shared-docker-ci-markdownlint:20260810

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Lint shell scripts
        uses: docker://ghcr.io/ponylang/shared-docker-ci-shellcheck:20260810

  verify-builder-image-builds:
    name: Verify the builder image builds
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Build docker image
      working-directory: ./.ci-dockerfiles/builder
      run: docker build . --file Dockerfile

  lint-post-good-first-issues:
    name: Verify that post-good-first-issues.py passes linting checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Login to GitHub Container Registry
        # v2.2.0
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build docker image
        run: docker build --pull --build-arg FROM_TAG="nightly" -t "ghcr.io/ponylang/pony-sync-helper-ci-good-first-issues:nightly" -f .ci-dockerfiles/good-first-issues/Dockerfile .
      - name: Lint post-good-first-issues.py
        run: docker run --entrypoint pylint --rm "ghcr.io/ponylang/pony-sync-helper-ci-good-first-issues:nightly" /post-good-first-issues.py

  verify-good-first-issues-image-builds:
    name: Verify the good-first-issues image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Login to GitHub Container Registry
        # v2.2.0
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build docker image
        run: docker build --pull --build-arg FROM_TAG="nightly" -t "ghcr.io/ponylang/pony-sync-helper-ci-good-first-issues:nightly" -f .ci-dockerfiles/good-first-issues/Dockerfile .
